services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - tuneguess

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Joignable seulement via Caddy. Pour l'admin, publier sur une interface privée,
    # ex. ports: ["127.0.0.1:8080:8080"] puis tunnel SSH.
    expose:
      - "8080"
    depends_on:
      - backend
    networks:
      - tuneguess

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # FRONTEND_URL, CORS_ORIGIN, *_REDIRECT_URI et ADMIN_PASSWORD : dans .env (voir README).
    env_file:
      - .env
    environment:
      PORT: "5000"
      # Seul le sous-réseau Docker fixé plus bas est cru pour X-Forwarded-For (Caddy, nginx).
      # Pas « uniquelocal » : il inclut le LAN et fd7a:115c:a1e0::/48 (Tailscale), donc forgeable.
      TRUST_PROXY: "172.28.57.0/24" # scan:ok
    expose:
      - "5000"
    networks:
      - tuneguess

volumes:
  caddy_data:
  caddy_config:

networks:
  tuneguess:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.57.0/24 # scan:ok (doit rester égal à TRUST_PROXY)
